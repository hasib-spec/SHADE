services:
  - type: web
    name: shade-backend
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: FORTYGUARD_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: DEMO_MODE
        value: "true"
