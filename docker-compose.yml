version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=postgres
      - TRITON_SERVER_URL=triton:8001
    depends_on:
      postgres:
        condition: service_healthy
      triton:
        condition: service_started
    networks:
      - shade_net
    volumes:
      - ./backend:/app

  postgres:
    image: postgis/postgis:15-3.3
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=shade_user
      - POSTGRES_PASSWORD=shade_secret
      - POSTGRES_DB=shade_db
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d
    networks:
      - shade_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shade_user -d shade_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  triton:
    image: nvcr.io/nvidia/tritonserver:23.08-py3
    ports:
      - "8001:8001"
      - "8000:8000" # HTTP port internally
      - "8002:8002" # Metrics
    command: tritonserver --model-repository=/models
    volumes:
      - ./models/triton_repo:/models
    networks:
      - shade_net
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - shade_net

networks:
  shade_net:

volumes:
  pgdata:
