version: '3.8'

# Core stack:  docker-compose up --build  -> backend :8000 + frontend :3000
# (the previous version had a fatal port conflict — backend and Triton both
#  bound host port 8000 — and shipped Postgres/Triton services that no code
#  actually called; both were removed so the default path always boots and
#  every service in this file is really used.)

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./backend:/app
    networks:
      - shade_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - shade_net

networks:
  shade_net:
