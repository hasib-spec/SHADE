[project]
name = "shade-backend"
version = "0.1.0"
description = "Street-level Heat Action & Decision Engine Backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "httpx>=0.24.0",
    "numpy>=1.24.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "geoalchemy2>=0.14.0",
    "asyncpg>=0.28.0",
    "langgraph>=0.0.20",
    "langchain-core>=0.1.0",
    "langchain-openai>=0.0.2",
    "tritonclient[all]>=2.36.0",
    "geojson>=3.0.0",
    "shapely>=2.0.0",
    "python-dotenv>=1.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
